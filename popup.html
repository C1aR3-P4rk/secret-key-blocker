<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 240px; padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #ffffff; color: #1f2937;
    }
    .header { font-size: 14px; font-weight: 700; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #f3f4f6; display: flex; align-items: center; gap: 6px; }
    .switch-container { display: flex; align-items: center; justify-content: space-between; background-color: #f9fafb; padding: 10px 12px; border-radius: 10px; border: 1px solid #e5e7eb; }
    .label-text { font-size: 13px; font-weight: 600; color: #374151; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #d1d5db; transition: .3s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(18px); }
    
    .alert-box {
      margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center; line-height: 1.4;
    }
    .alert-box.danger { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-box.safe { background-color: #ecfdf5; color: #059669; border: 1px solid #a7f3d0; }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span> SecretKey Blocker
  </div>
  <div class="switch-container">
    <span class="label-text">실시간 감지</span>
    <label class="switch">
      <input type="checkbox" id="toggleState" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div id="alertBox" class="alert-box safe">
    ✅ 현재 감지된 API 키가 없습니다.
  </div>

  <script src="popup.js"></script>
</body>
</html>
